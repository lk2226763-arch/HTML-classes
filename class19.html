<!DOCTYPE html>

<body>

    <h2>Basic function in javascript</h2>
    <script>


        function sumoftwonumbers() {

            let x, y, z;
            x = 5;
            y = 6;
            z = x + y;

            return z;

        }
        let sum = sumoftwonumbers();
        document.write('The sum of x and y is '+ sum)
    </script>




</body>


<body>
<h1>Parameters and function expressions.</h1>

<script>
    let oddoreven = function (number) {
        if (number % 2 == 0){
            document.write( number + " is an even number");
        } else {
            document.write(number + " is an odd number")
        }
    }
    let number = prompt("enter the number:");
    oddoreven(number);
</script>

</body>
