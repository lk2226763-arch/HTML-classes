<!DOCTYPE html>
<html>
    <head>
<title>My animal fact file</title>
<style>
    /* Page background- sets the colour and font for the whole page */
    body {
        background-color: darkgreen;
        font-family: Arial, Helvetica, sans-serif;

    }
    .fact-file{
        background-color: lightyellow;
        color: darkslategray;
        width: 360px;
        padding: 30px;
        margin: 30px;
       border: 4px solid rgb(66, 3, 105);  

    }
 .animal-name {
    color: forestgreen;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 30px;

 }
 .detail {
    color: darkslategray;

 }
 .cool-fact {
    color: darkorange;
    font-style: italic;
 }
</style>

    </head>
    <body>
        
        <div class="fact-file">
            <h2 class="animal-name">Snow leopard </h2> 
            <p class="detail">Type:Big cat</p> 
            <p class="detail">Lives in:mountain ranges of central asia</p>
            <p class="detail">Diet:deer,goats,and wild sheep</p>
            <p class="cool-fact">cool fact: can leap up to 15 meters on one jump!</p>
              </div>

    </body>
</html>
